<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--cc-bg);font-family:var(--cc-font-body);color:var(--cc-text)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:var(--cc-radius-sm);border:1px solid var(--cc-border);overflow:hidden}.sw i{display:block;height:56px}.sw b{display:block;font-size:12px;font-weight:600;padding:8px 10px 0}.sw span{display:block;font-family:var(--cc-font-numeric);font-size:11px;color:var(--cc-text-secondary);padding:0 10px 8px}.m{font-family:var(--cc-font-numeric);font-size:12px;color:var(--cc-text-secondary);display:flex;flex-direction:column;gap:4px}.m b{color:var(--cc-text);font-size:13px}</style></head><body>
<div style="display:flex;gap:40px">
<span class="m"><b>--cc-dur-fast · 140ms</b>press, hover, chips</span>

<span class="m"><b>--cc-ease-spring</b>cubic-bezier(.34,1.4,.64,1)</span>
</div></body></html>
