<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--cc-bg);font-family:var(--cc-font-body);color:var(--cc-text)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:var(--cc-radius-sm);border:1px solid var(--cc-border);overflow:hidden}.sw i{display:block;height:56px}.sw b{display:block;font-size:12px;font-weight:600;padding:8px 10px 0}.sw span{display:block;font-family:var(--cc-font-numeric);font-size:11px;color:var(--cc-text-secondary);padding:0 10px 8px}</style></head><body>
<div style="display:flex;gap:24px;align-items:flex-start">
<div style="width:220px;border:1px solid var(--cc-border);border-radius:var(--cc-radius-md);background:var(--cc-surface);padding:0 20px;position:relative;height:140px">
<div style="position:absolute;left:0;top:0;bottom:0;width:20px;background:repeating-linear-gradient(45deg,var(--cc-primary-soft),var(--cc-primary-soft) 4px,transparent 4px,transparent 8px)"></div>
<div style="position:absolute;right:0;top:0;bottom:0;width:20px;background:repeating-linear-gradient(45deg,var(--cc-primary-soft),var(--cc-primary-soft) 4px,transparent 4px,transparent 8px)"></div>
<div style="padding-top:16px;font-size:13px;color:var(--cc-text-secondary)">Contenido · gutter 20px</div>
<div style="position:absolute;left:0;right:0;bottom:0;height:44px;border-top:1px solid var(--cc-border);display:grid;place-items:center;font-size:11px;color:var(--cc-text-tertiary)">nav 64px</div>
</div>
<ul style="margin:0;padding-left:18px;font-size:13px;color:var(--cc-text-secondary);line-height:2">
<li><b style="color:var(--cc-text)">--cc-max-width</b> 430px — la app nunca se estira más</li>
<li><b style="color:var(--cc-text)">--cc-gutter</b> 20px lateral, constante</li>
<li><b style="color:var(--cc-text)">--cc-tap-target</b> 44px mínimo, sin excepciones</li>
<li><b style="color:var(--cc-text)">--cc-safe-bottom</b> env(safe-area-inset-bottom)</li>
</ul></div></body></html>
