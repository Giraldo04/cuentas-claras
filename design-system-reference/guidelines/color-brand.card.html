<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--cc-bg);font-family:var(--cc-font-body);color:var(--cc-text)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:var(--cc-radius-sm);border:1px solid var(--cc-border);overflow:hidden}.sw i{display:block;height:56px}.sw b{display:block;font-size:12px;font-weight:600;padding:8px 10px 0}.sw span{display:block;font-family:var(--cc-font-numeric);font-size:11px;color:var(--cc-text-secondary);padding:0 10px 8px}</style></head><body><div class="row">
<div class="sw"><i style="background:#0E6B54"></i><b>--cc-primary</b><span>#0E6B54</span></div><div class="sw"><i style="background:#0A5342"></i><b>--cc-primary-hover</b><span>#0A5342</span></div><div class="sw"><i style="background:#074638"></i><b>--cc-primary-press</b><span>#074638</span></div><div class="sw"><i style="background:#DCEFE8"></i><b>--cc-primary-soft</b><span>#DCEFE8</span></div><div class="sw"><i style="background:#E8964A"></i><b>--cc-accent</b><span>#E8964A</span></div><div class="sw"><i style="background:#D4813A"></i><b>--cc-accent-hover</b><span>#D4813A</span></div><div class="sw"><i style="background:#FBEBDC"></i><b>--cc-accent-soft</b><span>#FBEBDC</span></div>
</div></body></html>
